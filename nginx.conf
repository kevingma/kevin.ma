# Cloudflare terminates TLS; cloudflared forwards the original Host header.
map $uri $cache_control {
    ~^/_next/static/  "public, max-age=31536000, immutable";
    default           "public, max-age=300";
}

server {
    listen 8080;
    server_name www.kevin.ma;
    return 301 https://kevin.ma$request_uri;
}

server {
    listen 8080 default_server;
    server_name kevin.ma;
    root /usr/share/nginx/html;
    server_tokens off;

    # Plain-http visitors (if Cloudflare didn't already upgrade them).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://kevin.ma$request_uri;
    }

    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
