# Builds the site image that the home server pulls (every 15 min) and serves
# through the Cloudflare Tunnel. The weekly run picks up nginx/alpine patches.
name: image

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/kevingma/kevin.ma:latest
            ghcr.io/kevingma/kevin.ma:${{ github.sha }}
